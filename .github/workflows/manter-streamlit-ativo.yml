name: Manter Streamlit ativo

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Verificar período
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          echo "Data UTC: $TODAY"

          if [[ "$TODAY" < "2026-09-28" || "$TODAY" > "2026-10-31" ]]; then
            echo "Fora do período de manutenção."
            exit 0
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Acessar plataforma Streamlit
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            console.log('Abrindo Científica UFRR...');

            await page.goto(
              'https://cientifica-ufrr.streamlit.app/',
              {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              }
            );

            console.log('Página carregada.');
            console.log('Título:', await page.title());

            await page.waitForTimeout(30000);

            console.log('Acesso concluído.');

            await browser.close();
          })();
          EOF
